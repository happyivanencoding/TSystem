name: CI

on:
  push:
    paths-ignore:
      - "99_archive/**"
      - "**/archive/**"
      - "**/archives/**"
      - "**/runs/**"
      - "**/pipeline_runs/**"
      - "artifacts/**"
      - "**/outputs/**"
      - "**/output/**"
      - "**/generated/**"
      - "**/generated_assets/**"
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/.cache/**"
      - "**/__pycache__/**"
      - "**/*.egg-info/**"
      - "work/**"
      - "scratch/**"
  pull_request:
    paths-ignore:
      - "99_archive/**"
      - "**/archive/**"
      - "**/archives/**"
      - "**/runs/**"
      - "**/pipeline_runs/**"
      - "artifacts/**"
      - "**/outputs/**"
      - "**/output/**"
      - "**/generated/**"
      - "**/generated_assets/**"
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/.cache/**"
      - "**/__pycache__/**"
      - "**/*.egg-info/**"
      - "work/**"
      - "scratch/**"

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[screen,backtest,optimizer,web,test]"
      - name: Verify installed package boundaries
        run: >-
          python -P -c
          "import presentation_layer,tp_backtest,tp_core,tp_data,tp_experiments,tp_models,tp_pipelines,tp_portfolio,tp_reporting,tp_research"
      - name: Reject retired entrypoints and frozen paths
        run: tp-check-legacy-references --root .
      - name: Test
        run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08_presentation_layer/frontend/system_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 08_presentation_layer/frontend/system_dashboard/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
