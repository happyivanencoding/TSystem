<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>因子重构项目市场结果总览</title>
  <style>
    :root {
      --bg: #f7f6f1;
      --paper: #ffffff;
      --ink: #18211f;
      --muted: #60706b;
      --line: #d9ddd2;
      --green: #1f7a5a;
      --teal: #137d8a;
      --amber: #bb7a14;
      --brick: #a34b38;
      --blue: #355c8c;
      --soft-green: #e5f0ea;
      --soft-amber: #f4ead8;
      --soft-blue: #e8edf4;
      --shadow: 0 14px 40px rgba(24, 33, 31, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    a { color: var(--teal); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { max-width: 1320px; margin: 0 auto; padding: 28px 24px 44px; }
    header { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, .6fr); gap: 22px; align-items: end; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); line-height: 1.05; letter-spacing: 0; }
    .lead { margin: 14px 0 0; max-width: 860px; color: var(--muted); font-size: 16px; line-height: 1.7; }
    .stamp { justify-self: end; border: 1px solid var(--line); background: rgba(255,255,255,.62); border-radius: 8px; padding: 14px 16px; min-width: 280px; }
    .stamp strong { display: block; font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .stamp span { display: block; font-size: 13px; line-height: 1.5; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 22px 0; }
    .summary-card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: var(--shadow); min-height: 150px; }
    .summary-card h2 { margin: 0 0 10px; font-size: 17px; letter-spacing: 0; }
    .summary-card .best { min-height: 44px; color: var(--ink); font-weight: 720; line-height: 1.35; }
    .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .mini div { background: #f7faf7; border: 1px solid #e2e8dd; border-radius: 8px; padding: 8px; }
    .mini b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
    .mini span { font-weight: 760; font-size: 14px; }
    .tabs { position: sticky; top: 0; z-index: 5; background: rgba(247,246,241,.96); backdrop-filter: blur(8px); padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
    .tab-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .tab-button { appearance: none; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 11px 12px; font-weight: 760; color: var(--ink); cursor: pointer; min-height: 44px; }
    .tab-button[aria-selected="true"] { color: white; background: var(--green); border-color: var(--green); }
    .panel { display: none; padding-top: 20px; }
    .panel.active { display: block; }
    .market-head { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 16px; margin-bottom: 14px; }
    .verdict { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 18px; box-shadow: var(--shadow); }
    .verdict h2 { margin: 0 0 8px; font-size: 24px; }
    .verdict p { margin: 8px 0 0; color: var(--muted); line-height: 1.68; }
    .best-box { border: 1px solid #cfd8ce; background: linear-gradient(180deg, #ffffff 0%, #f7fbf8 100%); border-radius: 8px; padding: 18px; box-shadow: var(--shadow); }
    .eyebrow { font-size: 12px; text-transform: uppercase; color: var(--muted); font-weight: 780; letter-spacing: .06em; }
    .best-name { margin: 8px 0 10px; font-size: 22px; line-height: 1.22; font-weight: 820; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 12px 0 0; }
    .metric { background: #fbfcfb; border: 1px solid #e1e6df; border-radius: 8px; padding: 10px; min-height: 68px; }
    .metric b { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .metric span { font-size: 19px; font-weight: 800; }
    .section-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, .46fr); gap: 14px; align-items: start; }
    .block { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
    .block h3 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0; }
    .chart-wrap { height: 300px; border: 1px solid #e2e6df; border-radius: 8px; background: #fbfcfb; padding: 10px; }
    .chart-wrap svg { width: 100%; height: 100%; display: block; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 8px; }
    .dot { width: 10px; height: 10px; display: inline-block; border-radius: 999px; margin-right: 6px; }
    .bar-list { display: grid; gap: 9px; }
    .bar-row { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(90px, .7fr) 58px; gap: 10px; align-items: center; }
    .bar-label { font-size: 12px; line-height: 1.25; overflow-wrap: anywhere; }
    .bar-track { height: 10px; border-radius: 999px; background: #eef2ec; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--teal), var(--green)); }
    .bar-score { text-align: right; font-size: 12px; font-weight: 760; }
    .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .fact { border: 1px solid #e1e6df; background: #fbfcfb; border-radius: 8px; padding: 10px; min-height: 64px; }
    .fact b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .fact span { font-size: 14px; font-weight: 760; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; min-width: 840px; }
    th, td { border-bottom: 1px solid #e6e9e3; padding: 9px 8px; text-align: left; vertical-align: top; font-size: 13px; }
    th { color: var(--muted); font-size: 12px; background: #f8faf7; position: sticky; top: 58px; z-index: 1; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    .table-scroll { overflow-x: auto; border: 1px solid #e1e6df; border-radius: 8px; }
    .family-list { display: grid; gap: 10px; }
    .family-row { border: 1px solid #e1e6df; background: #fbfcfb; border-radius: 8px; padding: 10px; }
    .family-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .family-top b { text-transform: capitalize; }
    .family-top span { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .family-row p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; }
    .links a { border: 1px solid #d8e2dc; background: var(--soft-green); border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 740; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 10px; }
    .source-path { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; color: #52615c; overflow-wrap: anywhere; }
    @media (max-width: 980px) {
      .shell { padding: 20px 14px 34px; }
      header, .market-head, .section-grid { grid-template-columns: 1fr; }
      .stamp { justify-self: stretch; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tab-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chart-wrap { height: 250px; }
    }
    @media (max-width: 560px) {
      .summary-grid, .facts, .tab-list { grid-template-columns: 1fr; }
      .metric-grid { grid-template-columns: 1fr; }
      h1 { font-size: 30px; }
      .best-name { font-size: 19px; }
      th { position: static; }
    }

.chart-wrap{height:430px}

.ratio-chip{border:1px solid #e1e6df;background:#fbfcfb;border-radius:8px;padding:8px}
.ratio-chip b{display:block;color:var(--muted);font-size:11px}.ratio-chip span{font-weight:800}
.bar-row{appearance:none;width:100%;border:1px solid transparent;background:transparent;border-radius:8px;display:grid;grid-template-columns:minmax(150px,1fr) minmax(90px,.7fr) 58px;gap:10px;align-items:center;padding:2px;cursor:pointer;text-align:left;color:var(--ink)}
.bar-row:hover,.bar-row.active{background:#f2f7f4;border-color:#cfe0d6}
.component-detail{margin-top:12px;border:1px solid #dfe6dc;border-radius:8px;background:#fbfcfb;padding:12px}
.component-detail h4{margin:0 0 10px;font-size:15px}.component-family{border-top:1px solid #e6eae4;padding-top:10px;margin-top:10px}.component-family:first-of-type{border-top:0;padding-top:0;margin-top:0}
.family-line{display:flex;justify-content:space-between;gap:10px;font-weight:780}.family-line span{color:var(--muted);font-size:12px;white-space:nowrap}

.bar-label small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.gate-summary{display:grid;grid-template-columns:minmax(120px,.28fr) minmax(0,1fr);gap:8px;margin-bottom:10px}
.gate-summary div{border:1px solid #e1e6df;background:#fbfcfb;border-radius:8px;padding:9px}
.gate-summary b{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.gate-summary span{font-weight:760}
.var-row small{grid-column:1 / -1;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}

function barList(m){ const rows=m.top10; const maxScore=Math.max(...rows.map(r=>Number(r.score)).filter(Number.isFinite).map(v=>Math.abs(v)),1); return `<div class="bar-list">${rows.map((r,i)=>{ const raw=Number(r.score); const width=Number.isFinite(raw)?Math.max(4,Math.abs(raw)/maxScore*100):4; return `<button class="bar-row${i===selected[m.id]?' active':''}" type="button" data-market="${m.id}" data-index="${i}" aria-expanded="${i===selected[m.id]}"><div class="bar-label">${esc(r.label)}<small>${esc(r.role)}</small></div><div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div><div class="bar-score">${esc(r.score)}</div></button>`; }).join('')}</div><div class="component-detail" id="components-${m.id}"></div>`; }
function familyList(rows){ if(!rows?.length) return '<p class="note">暂无 raw gate 摘要。</p>'; return `<div class="family-list">${rows.map(r=>`<div class="family-row"><div class="family-top"><b>${esc(r.family)}</b><span>${esc(r.top10_count)} pass · Best ${esc(r.best_score)}</span></div><p>${esc(r.best)}；通过率 ${esc(r.pass_rate)}；通过变量均值 ${esc(r.mean_top10_score)}</p></div>`).join('')}</div>`; }
function rawSingleBlock(m){ const raw=m.raw_single; if(!raw) return ''; const body=(raw.rows_all||[]).map(r=>`<tr><td>${esc(r.label)}</td><td>${esc(r.family)}</td><td>${esc(r.role)}</td><td class="num">${esc(r.cagr)}</td><td class="num">${esc(r.active)}</td><td class="num">${esc(r.ratio_dd)}</td><td class="num">${esc(r.te)}</td><td class="num">${esc(r.hit)}</td><td class="num">${esc(r.top_worst)}</td><td class="num"><b>${esc(r.score)}</b></td><td><span class="source-path">${esc(r.metric)}</span></td></tr>`).join(''); return `<section class="block"><h3>${esc(raw.title)}</h3><div class="gate-summary"><div><b>Official runs</b><span>${esc(raw.run_success)}</span></div><div><b>Universe rows</b><span>${esc(raw.rows)} · ${esc(raw.first_date)} 至 ${esc(raw.last_date)}</span></div></div><div class="table-scroll"><table style="min-width:1040px"><thead><tr><th>变量</th><th>Family</th><th>Role</th><th class="num">CAGR</th><th class="num">Active CAGR</th><th class="num">Ratio DD</th><th class="num">TE</th><th class="num">Hit</th><th class="num">Top/Worst</th><th class="num">Robust</th><th>Metric</th></tr></thead><tbody>${body}</tbody></table></div><p class="note source-path">${esc(raw.run_dir)}</p></section>`; }
function rawGateBlock(m){ const gate=m.raw_gate; if(!gate) return ''; const rows=gate.passed||[]; const body=rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${esc(r.family)}</td><td>${esc(r.source)}</td><td class="num">${esc(r.coverage)}</td><td class="num">${esc(r.ratio_cagr)}</td><td class="num">${esc(r.top_worst)}</td><td class="num"><b>${esc(r.score)}</b></td><td><span class="source-path">${esc(r.metric)}</span></td></tr>`).join(''); return `<section class="block"><h3>Raw Gate 通过变量</h3><div class="gate-summary"><div><b>Passed</b><span>${esc(gate.passed_count)} / ${esc(gate.total_count)}</span></div><div><b>Source</b><span class="source-path">${esc(gate.path)}</span></div></div><div class="table-scroll"><table style="min-width:860px"><thead><tr><th>变量</th><th>Family</th><th>Source</th><th class="num">Coverage</th><th class="num">Ratio CAGR</th><th class="num">Top/Worst</th><th class="num">Robust</th><th>Metric</th></tr></thead><tbody>${body}</tbody></table></div></section>`; }
function renderComponents(m){ const item=m.top10[selected[m.id]]; const root=document.getElementById(`components-${m.id}`); if(!root||!item)return; const parts=item.composition||[]; root.innerHTML=`<h4>${esc(item.label)} 构成</h4>${parts.length?parts.map(f=>`<div class="component-family"><div class="family-line"><b>${esc(f.familyLabel)}</b><span>${esc(f.weight)}</span></div>${(f.variables||[]).map(v=>`<div class="var-row"><b>${esc(v.label)}</b><span>${esc(v.weight)}</span><small>${esc(v.metric)}</small></div>`).join('')}</div>`).join(''):'<p class="note">暂无可展开的组成定义。</p>'}`; }
function drawComboChart(id,item){ const root=document.getElementById(id); const series=item?.chart?.series||[]; if(!root||!series.length)return; const width=840,height=390,pad={left:48,right:18,top:16,bottom:30},mid=230,gap=34; const x=i=>pad.left+i/Math.max(1,series.length-1)*(width-pad.left-pad.right); const domain=(keys)=>{ const vals=series.flatMap(d=>keys.map(k=>d[k])).filter(Number.isFinite); const min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min); return {min,max,span};}; const navD=domain(['top','worst','bench']), ratioD=domain(['topBench','worstBench','topWorst']); const yNav=v=>pad.top+(navD.max-v)/navD.span*(mid-pad.top); const yRatio=v=>mid+gap+(ratioD.max-v)/ratioD.span*(height-mid-gap-pad.bottom); const path=(key,y)=>series.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).join(' '); const ticks=(d,y)=>[d.min,d.min+d.span/2,d.max].map(t=>`<line x1="${pad.left}" x2="${width-pad.right}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="${colors.grid}"/><text x="8" y="${(y(t)+4).toFixed(1)}" fill="${colors.text}" font-size="11">${Math.round(t)}</text>`).join(''); root.innerHTML=`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Top Worst NAV and ratio chart">${ticks(navD,yNav)}<path d="${path('bench',yNav)}" fill="none" stroke="${colors.bench}" stroke-width="2.1"/><path d="${path('worst',yNav)}" fill="none" stroke="${colors.worst}" stroke-width="2.1"/><path d="${path('top',yNav)}" fill="none" stroke="${colors.top}" stroke-width="2.5"/><text x="${pad.left}" y="${mid+20}" fill="${colors.text}" font-size="11">Ratio lines</text>${ticks(ratioD,yRatio)}<path d="${path('topBench',yRatio)}" fill="none" stroke="${colors.topBench}" stroke-width="2"/><path d="${path('worstBench',yRatio)}" fill="none" stroke="${colors.worstBench}" stroke-width="2"/><path d="${path('topWorst',yRatio)}" fill="none" stroke="${colors.topWorst}" stroke-width="2"/><text x="${pad.left}" y="${height-8}" fill="${colors.text}" font-size="11">${esc(series[0].date)}</text><text x="${width-pad.right}" y="${height-8}" text-anchor="end" fill="${colors.text}" font-size="11">${esc(series[series.length-1].date)}</text></svg>`; }
function refreshMarket(m){ const item=m.top10[selected[m.id]]; document.querySelectorAll(`[data-market="${m.id}"]`).forEach(btn=>{ const active=Number(btn.dataset.index)===selected[m.id]; btn.classList.toggle('active',active); btn.setAttribute('aria-expanded',String(active)); }); const title=document.getElementById(`selected-title-${m.id}`); if(title) title.innerHTML=`当前: <b>${esc(item.label)}</b><br><span>${esc(item.role)}</span><br><span class="source-path">${esc(item.metric)}</span>`; const ratios=document.getElementById(`ratios-${m.id}`); if(ratios) ratios.innerHTML=`<div class="ratio-chip"><b>Top / Bench</b><span>${esc(item.chart.ratios.topBench)}</span></div><div class="ratio-chip"><b>Worst / Bench</b><span>${esc(item.chart.ratios.worstBench)}</span></div><div class="ratio-chip"><b>Top / Worst</b><span>${esc(item.chart.ratios.topWorst)}</span></div>`; drawComboChart(`chart-${m.id}`,item); renderComponents(m); }
function panel(m,idx){ return `<section class="panel${idx===0?' active':''}" id="panel-${m.id}" role="tabpanel" aria-labelledby="tab-${m.id}"><div class="market-head"><article class="verdict"><div class="eyebrow">${esc(m.manifest.benchmark)} · ${esc(m.data.first_date)} 至 ${esc(m.data.last_date)}</div><h2>${esc(m.name)}</h2><p>${esc(m.verdict)}</p><p>${esc(m.watch)}</p><p class="note">${esc(m.memory)}</p></article><article class="best-box"><div class="eyebrow">最佳 robust_score</div><div class="best-name">${esc(m.best.label||m.best.metric)}</div><div class="source-path">${esc(m.best.metric)}</div><div class="metric-grid">${metricBox('Robust',m.best.score)}${metricBox('CAGR',m.best.cagr)}${metricBox('Active CAGR',m.best.active_cagr)}${metricBox('Hit Rate',m.best.hit_rate)}${metricBox('Ratio DD',m.best.ratio_dd)}${metricBox('TE',m.best.tracking_error)}${metricBox('Top/Worst',m.best.top_worst)}${metricBox('Turnover',m.best.turnover)}</div></article></div><div class="section-grid"><div><section class="block"><div class="chart-head"><h3>Top/Worst NAV 与 Ratio</h3><div class="selected-title" id="selected-title-${m.id}"></div></div><div class="chart-wrap" id="chart-${m.id}"></div><div class="legend"><span><i class="dot" style="background:${colors.top}"></i>Top NAV</span><span><i class="dot" style="background:${colors.worst}"></i>Worst NAV</span><span><i class="dot" style="background:${colors.bench}"></i>Benchmark</span><span><i class="dot" style="background:${colors.topBench}"></i>Top/Bench</span><span><i class="dot" style="background:${colors.worstBench}"></i>Worst/Bench</span><span><i class="dot" style="background:${colors.topWorst}"></i>Top/Worst</span></div><div class="ratio-grid" id="ratios-${m.id}"></div></section><section class="block"><h3>Robust Score 前十</h3>${barList(m)}</section><section class="block"><h3>Top/Worst 官方结果表</h3>${topTable(m.top10)}</section>${rawGateBlock(m)}${rawSingleBlock(m)}</div><aside><section class="block"><h3>数据与运行状态</h3><div class="facts">${fact('Universe',m.data.universe_rule)}${fact('Rows',m.data.rows)}${fact('Months',m.data.date_count)}${fact('Avg names',m.data.avg_names)}${fact('SEDOL coverage',m.data.sedol_coverage)}${fact('Run success',m.manifest.success_rate)}</div><p class="note source-path">${esc(m.run_dir)}</p></section><section class="block"><h3>Raw Gate 家族快照</h3>${familyList(m.family_stats)}</section><section class="block"><h3>需谨慎的尾部候选</h3>${weakTable(m.weak)}</section><section class="block"><h3>原始产物</h3><div class="links">${m.plot_links.map(l=>`<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('')}</div></section></aside></div></section>`; }
document.getElementById('summary').innerHTML=DATA.summary.map(summaryCard).join('');
document.getElementById('tabs').innerHTML=DATA.markets.map((m,i)=>`<button class="tab-button" id="tab-${m.id}" role="tab" aria-controls="panel-${m.id}" aria-selected="${i===0}">${esc(m.name)}</button>`).join('');
document.getElementById('panels').innerHTML=DATA.markets.map(panel).join('');
DATA.markets.forEach(refreshMarket);
document.addEventListener('click',e=>{ const bar=e.target.closest('.bar-row'); if(bar){ const m=DATA.markets.find(x=>x.id===bar.dataset.market); selected[m.id]=Number(bar.dataset.index); refreshMarket(m); } const tab=e.target.closest('.tab-button'); if(tab){ document.querySelectorAll('.tab-button').forEach(b=>b.setAttribute('aria-selected','false')); document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); tab.setAttribute('aria-selected','true'); document.getElementById(tab.getAttribute('aria-controls')).classList.add('active'); const m=DATA.markets.find(x=>`panel-${x.id}`===tab.getAttribute('aria-controls')); if(m) requestAnimationFrame(()=>refreshMarket(m)); } });

  </script>
</body>
</html>
