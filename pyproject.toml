[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tp-workspace"
version = "0.1.0"
description = "TP 研究项目的共享工具与 canonical 数据契约"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "duckdb>=0.10",
  "python-dateutil>=2.8",
  "pyarrow>=14",
  "openpyxl>=3.1",
  "tabulate>=0.9",
  "pydantic>=2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
screen = [
  "numba>=0.58",
  "pandarallel>=1.6",
]
backtest = [
  "scipy>=1.10",
  "plotly>=5",
]
optimizer = [
  "cvxpy>=1.7,<1.8",
  "ecos>=2.0",
]
web = [
  "dash>=2.17",
  "fastapi>=0.110",
  "Flask>=3.0",
  "plotly>=5.24",
  "uvicorn>=0.27",
  "streamlit>=1.30",
]
ml = [
  "scikit-learn>=1.3",
  "xgboost>=2",
  "shap>=0.44",
]
news = [
  "google-cloud-bigquery>=3.25",
]
test = [
  "pytest>=8",
  "scikit-learn>=1.3",
  "hmmlearn>=0.3",
  "matplotlib>=3.8",
  "statsmodels>=0.14,<0.15",
]

[project.scripts]
tp-organize-inputs = "tp_core.production_inputs:main"
tp-returns-audit = "tp_core.returns_audit:main"
tp-check-legacy-references = "tp_core.legacy_policy:main"
tp-migrate-directory = "tp_core.directory_migration:main"
tp-prune-artifacts = "tp_core.artifact_retention:main"
tp-validate-signals = "tp_core.signals:main"
tp-pipeline-refresh-data = "tp_pipelines.refresh_data:main"
tp-pipeline-refresh-supplemental-data = "tp_pipelines.refresh_supplemental_data:main"
tp-pipeline-export-signals = "tp_pipelines.export_signals:main"
tp-pipeline-build-candidates = "tp_pipelines.build_candidates:main"
tp-pipeline-optimize-portfolio = "tp_pipelines.optimize_portfolio:main"
tp-pipeline-run-backtest = "tp_pipelines.run_backtest:main"
tp-pipeline-generate-report = "tp_pipelines.generate_report:main"
tp-news-shadow = "tp_models.news.shadow:main"
tp-pipeline-run-all = "tp_pipelines.run_all:main"
tp-backtest = "tp_backtest.cli:main"
tp-presentation = "presentation_layer.cli:main"
tp-experiments = "tp_experiments.cli:main"
tp-research = "tp_research.cli:main"
tp-build-factor-research-app = "tp_reporting.factor_research_app:main"
tp-build-factor-explorer = "tp_reporting.factor_explorer:main"
tp-build-stoxx600-factor-explorer = "tp_reporting.stoxx600_factor_explorer:main"
tp-company-report = "tp_reporting.company_research.cli:main"
tp-data-audit = "tp_core.analytics.cli:data_audit_main"
tp-data-benchmark = "tp_core.analytics.cli:benchmark_main"
tp-data-build-compat-exports = "tp_core.analytics.cli:compatibility_export_main"
tp-data-migrate-returns = "tp_core.analytics.cli:migrate_returns_main"
tp-data-migrate-screen = "tp_core.analytics.cli:migrate_screen_main"
tp-data-validate-parity = "tp_core.analytics.cli:parity_main"
tp-duckdb-build-catalog = "tp_core.analytics.cli:build_catalog_main"
tp-duckdb-validate-release = "tp_core.analytics.cli:validate_release_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tp_pipelines = ["supplemental_sources.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
norecursedirs = [
  "99_archive",
  "archive",
  "archives",
  "_quarantine_*",
  "legacy_apps",
  "runs",
  "pipeline_runs",
  "artifacts",
  "outputs",
  "output",
  "generated",
  "generated_assets",
  "node_modules",
  "dist",
  "build",
  ".cache",
  "__pycache__",
  "*.egg-info",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = [
  "99_archive",
  "artifacts",
  "**/archive",
  "**/archives",
  "**/_quarantine_*",
  "08_presentation_layer/legacy_apps",
  "**/node_modules",
  "**/dist",
  "**/build",
  "**/outputs",
  "**/output",
  "**/runs",
  "**/pipeline_runs",
  "**/generated",
  "**/generated_assets",
  "**/.cache",
  "**/__pycache__",
  "**/*.egg-info",
]

[tool.mypy]
mypy_path = "src"
exclude = "(^99_archive/|^artifacts/|(^|/)(archive|archives|outputs?|runs|pipeline_runs|generated|generated_assets|node_modules|dist|build|\\.cache|__pycache__)/|/_quarantine_[^/]+/|^08_presentation_layer/legacy_apps/|/[^/]+\\.egg-info/)"


