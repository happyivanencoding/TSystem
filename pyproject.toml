[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tp-workspace"
version = "0.1.0"
description = "TP 研究项目的共享工具与 canonical 数据契约"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "python-dateutil>=2.8",
  "pyarrow>=14",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
screen = [
  "numba>=0.58",
  "pandarallel>=1.6",
]
backtest = [
  "scipy>=1.10",
  "plotly>=5",
  "PyYAML>=6.0",
]
optimizer = [
  "cvxpy>=1.7,<1.8",
  "ecos>=2.0",
]
web = [
  "dash>=2.17",
  "fastapi>=0.110",
  "Flask>=3.0",
  "plotly>=5.24",
  "uvicorn>=0.27",
  "pydantic>=2",
  "streamlit>=1.30",
]
ml = [
  "scikit-learn>=1.3",
  "xgboost>=2",
  "shap>=0.44",
]
news = [
  "google-cloud-bigquery>=3.25",
]
test = [
  "pytest>=8",
  "scikit-learn>=1.3",
]

[project.scripts]
tp-organize-inputs = "tp_core.production_inputs:main"
tp-returns-audit = "tp_core.returns_audit:main"
tp-check-legacy-references = "tp_core.legacy_policy:main"
tp-prune-artifacts = "tp_core.artifact_retention:main"
tp-validate-signals = "tp_core.signals:main"
tp-pipeline-refresh-data = "tp_pipelines.refresh_data:main"
tp-pipeline-refresh-supplemental-data = "tp_pipelines.refresh_supplemental_data:main"
tp-pipeline-export-signals = "tp_pipelines.export_signals:main"
tp-pipeline-build-candidates = "tp_pipelines.build_candidates:main"
tp-pipeline-optimize-portfolio = "tp_pipelines.optimize_portfolio:main"
tp-pipeline-run-backtest = "tp_pipelines.run_backtest:main"
tp-pipeline-generate-report = "tp_pipelines.generate_report:main"
tp-pipeline-run-all = "tp_pipelines.run_all:main"
tp-presentation = "presentation_layer.cli:main"
tp-experiments = "tp_experiments.cli:main"
tp-build-factor-research-app = "tp_reporting.factor_research_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tp_pipelines = ["supplemental_sources.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = [
  "tests",
  "02_pipelines/tests",
  "03_regime_model/tests",
  "06_optimiser/test_optimizer.py",
  "07_backtest_code/tests",
  "08_presentation_layer/tests",
  "13_sector_score_model/tests",
  "16_news_market_signal/tests",
]

[tool.ruff]
line-length = 100
exclude = [
  "99_archive",
  "**/_quarantine_*",
  "**/node_modules",
  "**/dist",
  "**/build",
  "**/outputs",
  "**/output",
  "**/runs",
  "**/*.egg-info",
  "07_backtest_code/runs",
  "10_pipeline_runs",
]

[tool.mypy]
mypy_path = "src"
exclude = "(^99_archive/|/_quarantine_[^/]+/|/node_modules/|/dist/|/build/|/outputs?/|/runs/|/[^/]+\\.egg-info/|^10_pipeline_runs/)"


